[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-production-readiness"
version = "0.1.0"
description = "Evaluation-driven agentic production readiness reviewer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5.0",
  "pytest>=8.0,<9.0",
  "pyyaml>=6.0,<7.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["evals/cases"]
